<title>Drillbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single phone-first column; the player is a full-screen dark "court" with a chalk-yellow timer. */
:root {
  --paper: #eef2ee;
  --card: #ffffff;
  --ink: #102320;
  --ink-2: #4b5e5a;
  --line: #d5ddd9;
  --teal: #0c6b61;
  --teal-ink: #ffffff;
  --chalk: #f2c230;
  --chip: #e2ebe7;
  --warn: #9a5b00;
  --warn-bg: #fbefd6;
  --danger: #b3261e;
  --court: #0b2f2b;
  --court-2: #12423c;
  --court-ink: #f4f7f5;
  --court-dim: #9fbdb6;
  --rest: #1b2740;
  --rest-2: #24345a;
  --fig-near: #102320;
  --fig-far: #8fb0a9;
  --fig-floor: #d8e1dd;
  --fig-prop: #d9922a;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d1715; --card: #15221f; --ink: #e8efec; --ink-2: #9db2ad; --line: #26372f; --teal: #3fb5a5; --teal-ink: #062421;
  --chip: #1f302c; --warn: #f2c56b; --warn-bg: #3a2d10; --danger: #ff8a80; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0d1715; --card: #15221f; --ink: #e8efec; --ink-2: #9db2ad; --line: #26372f; --teal: #3fb5a5; --teal-ink: #062421;
  --chip: #1f302c; --warn: #f2c56b; --warn-bg: #3a2d10; --danger: #ff8a80; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .row:focus-visible { outline: 3px solid var(--chalk); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 18px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--court); display: grid; place-items: center; }
.brand-name { font-family: var(--display); font-weight: 800; font-stretch: 112%; font-size: 22px; letter-spacing: -0.01em; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.hero h1 { font-size: 34px; font-weight: 800; font-stretch: 88%; line-height: 1.02; letter-spacing: -0.01em; }
.hero p { margin: 8px 0 0; max-width: 46ch; }

.drop { position: relative; border: 2px dashed var(--line); border-radius: 18px; background: var(--card); padding: 18px; display: grid; gap: 16px; transition: border-color .15s, background .15s; }
.addhead { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.addbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.addbtns .btn { position: relative; padding: 0 12px; font-size: 15px; cursor: pointer; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
.pages { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.pagestrip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px; }
.pg { position: relative; flex: 0 0 auto; }
.pg img { width: 64px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; background: var(--chip); }
.pgx { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 12px; border: 0; background: var(--ink); color: var(--card); font-size: 16px; line-height: 24px; padding: 0; }
.drop.over { border-color: var(--teal); background: var(--chip); }
.drop-ic { width: 52px; height: 52px; border-radius: 14px; background: var(--teal); color: var(--teal-ink); display: grid; place-items: center; }
.drop strong { display: block; font-size: 16px; }
.pickrow { display: grid; gap: 6px; margin-top: -8px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--teal); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

.list { display: flex; flex-direction: column; gap: 10px; }
.rcard { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; text-align: left; width: 100%; }
.rcard .thumb, .row .thumb { width: 56px; height: 56px; border-radius: 12px; background: #f3f6f4; overflow: hidden; display: grid; place-items: center; }
.rcard .thumb img, .row .thumb img { width: 100%; height: 100%; object-fit: cover; }
.rcard h3 { font-size: 17px; font-weight: 700; font-stretch: 95%; }
.rcard .meta { font-size: 13px; color: var(--ink-2); }
.chev { color: var(--ink-2); }

.howto { display: grid; gap: 10px; counter-reset: h; margin-top: 4px; }
.howto div { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.howto b { font-family: var(--display); font-size: 20px; color: var(--teal); line-height: 1.1; }

.wcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
.wcard h2 { font-size: 22px; font-weight: 800; font-stretch: 90%; }
.wcard .meta { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--chip); font-size: 12.5px; font-weight: 600; color: var(--ink); white-space: nowrap; }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 14px; border: 0; background: var(--teal); color: var(--teal-ink); font-weight: 700; font-size: 16px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: default; }

.ov-head { display: grid; gap: 8px; margin-bottom: 14px; }
.ov-head h1 { font-size: 30px; font-weight: 800; font-stretch: 86%; line-height: 1.04; }
.intro { font-size: 14px; color: var(--ink-2); max-width: 60ch; }
.row { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.row.off { opacity: .5; }
.row .nm { font-weight: 600; font-size: 15.5px; display: block; }
.row .code { font-family: var(--display); font-weight: 700; color: var(--teal); margin-right: 6px; }
.row .dose { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.row .mus { font-size: 12px; color: var(--ink-2); }
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--paper) 70%, transparent); z-index: 5; }
.dock .btn { max-width: 528px; margin: 0 auto; display: flex; width: 100%; font-size: 17px; min-height: 56px; }

.sheet-bg { position: fixed; inset: 0; background: rgba(5, 15, 13, .5); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); color: var(--ink); width: 100%; max-width: 560px; max-height: 88%; overflow: auto; border-radius: 22px 22px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet > * { flex-shrink: 0; }
.sheet h2 { font-size: 24px; font-weight: 800; font-stretch: 90%; }
.sheet ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.fig-box { background: #f3f6f4; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; display: grid; place-items: center; }
.fig-box img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.fig-box canvas { width: 100%; height: 100%; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.field input, .field select, textarea { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); width: 100%; min-width: 0; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.check input { width: 22px; height: 22px; accent-color: var(--teal); }
.tip { font-size: 14px; color: var(--ink-2); border-left: 3px solid var(--chalk); padding-left: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; z-index: 60; font-weight: 600; max-width: calc(100% - 32px); }
.busy { position: fixed; inset: 0; z-index: 50; background: var(--court); color: var(--court-ink); display: grid; place-items: center; padding: 24px; text-align: center; }
.busy h2 { font-size: 26px; font-weight: 800; font-stretch: 92%; margin: 14px 0 6px; }
.busy #bfig canvas { width: 220px; height: 170px; }
.err { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 14px; font-weight: 500; }
.danger { color: var(--danger); }

/* ---------- player (single dark look) ---------- */
.player { position: fixed; inset: 0; z-index: 40; background: var(--court); color: var(--court-ink); display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); transition: background .4s; overflow: hidden; }
.player.is-rest { background: var(--rest); }
.player .pbar { display: flex; gap: 3px; margin: 6px 0 14px; }
.player .pbar i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); overflow: hidden; position: relative; }
.player .pbar i b { position: absolute; inset: 0; background: var(--chalk); transform-origin: left; transform: scaleX(0); }
.ptop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pbtn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: var(--court-ink); display: grid; place-items: center; flex: none; }
.pbtn svg { width: 20px; height: 20px; }
.pcount { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--chalk); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.pname { text-align: center; margin-top: 4px; }
.pname h2 { font-size: clamp(24px, 7vw, 34px); font-weight: 800; font-stretch: 88%; line-height: 1.05; }
.pname .sub { color: var(--court-dim); font-weight: 600; margin-top: 4px; font-size: 14px; min-height: 1.4em; }
.stage { position: relative; flex: 1 1 auto; min-height: 150px; margin: 14px 0 10px; display: grid; place-items: center; }
.vis { position: relative; width: min(100%, 52vh, 420px); aspect-ratio: 1 / 1; border-radius: 28px; background: #f6f8f6; overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,.25); }
.vis #visIn { position: absolute; inset: 0; }
.vis img, .vis canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.vis .swap { position: absolute; right: 10px; top: 10px; z-index: 2; background: rgba(16,35,32,.78); color: #fff; border: 0; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 700; }
.vis .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: rgba(16,35,32,.12); }
.vis .bar b { position: absolute; inset: 0; background: var(--chalk); transform-origin: left; transform: scaleX(0); }
.breath { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(16,35,32,.85); color: #fff; font-weight: 700; padding: 6px 14px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
.readout { text-align: center; display: grid; gap: 2px; justify-items: center; }
.big { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: clamp(64px, 20vw, 104px); line-height: .95; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.big small { font-size: .32em; font-stretch: 100%; font-weight: 700; color: var(--court-dim); margin-left: 6px; letter-spacing: 0; }
.dots { display: flex; gap: 6px; justify-content: center; min-height: 10px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.22); }
.dots i.on { background: var(--chalk); }
.pctl { display: grid; grid-template-columns: 56px 1fr 56px; gap: 12px; align-items: center; margin-top: 12px; }
.pctl .main { min-height: 60px; border-radius: 18px; border: 0; background: var(--chalk); color: #1c1a10; font-weight: 800; font-size: 18px; font-family: var(--display); font-stretch: 105%; letter-spacing: .02em; }
.pctl .side { width: 56px; height: 56px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: var(--court-ink); display: grid; place-items: center; }
.pctl .side svg { width: 22px; height: 22px; }
.extra { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.extra button { background: rgba(255,255,255,.1); border: 0; color: var(--court-ink); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 13.5px; }
.extra button.on { background: var(--chalk); color: #1c1a10; }
.upnext { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; background: rgba(255,255,255,.08); border-radius: 18px; padding: 10px; text-align: left; width: min(100%, 420px); }
.upnext .thumb { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; background: #f6f8f6; position: relative; }
.upnext .thumb img, .upnext .thumb canvas { width: 100%; height: 100%; object-fit: cover; }
.upnext .first { font-size: 13px; color: var(--court-dim); }
.pfin { flex: 1; display: grid; place-items: center; text-align: center; gap: 18px; align-content: center; }
.pfin h2 { font-size: 40px; font-weight: 800; font-stretch: 85%; }
.stats { display: flex; gap: 22px; justify-content: center; }
.stats div { display: grid; }
.stats b { font-family: var(--display); font-size: 34px; font-weight: 800; font-stretch: 80%; color: var(--chalk); font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--court-dim); text-transform: uppercase; letter-spacing: .08em; }
.howsheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--court-2); border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 70%; overflow: auto; z-index: 5; display: grid; gap: 10px; }
.howsheet ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.howsheet .tip { color: var(--court-dim); }
@media (max-height: 640px) { .pname h2 { font-size: 24px; } .big { font-size: 60px; } .stage { margin: 8px 0 6px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<div id="app"></div>
<div id="layer"></div>
